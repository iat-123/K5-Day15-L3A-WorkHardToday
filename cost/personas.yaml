# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Số và nguồn của nhóm WorkHardToday (cập nhật 28/11): persona theo khảo sát câu 2, giá theo bảng giá BTC.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 6
  base: 30
  high: 100
  source: "Thấp 6 = số người trực tiếp soạn/đăng bài trong khảo sát (evidence/survey/results_summary.md, n = 6). Cơ sở 30, cao 100: (tự ước tính) — số nhân viên soạn bài nếu vài shop thời trang cùng dùng, chưa có nguồn công khai"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
                    # 1 phiên = 1 lần tải file sản phẩm; 1 lượt hỏi = 1 dòng sản phẩm trong file
                    # share và số bài / tuần: khảo sát câu 2 "số bài đã soạn/đăng trong 7 ngày qua" (5 người nhớ được số: 1 bài 1/5 · 3 bài 1/5 · 5 bài 3/5)
                    # uses_per_month = 4: gom bài mỗi tuần thành 1 file (tự ước tính)
  - name: dung_it
    share: 0.2
    uses_per_month: 4
    turns_per_session: 1
    source: "Khảo sát câu 2: 1/5 người đăng 1 bài / 7 ngày (evidence/survey/results_summary.md). 4 phiên / tháng: (tự ước tính)"
  - name: dung_vua
    share: 0.2
    uses_per_month: 4
    turns_per_session: 3
    source: "Khảo sát câu 2: 1/5 người đăng 3 bài / 7 ngày. 4 phiên / tháng: (tự ước tính)"
  - name: dung_nhieu
    share: 0.6
    uses_per_month: 4
    turns_per_session: 5
    source: "Khảo sát câu 2: 3/5 người đăng 5 bài / 7 ngày. 4 phiên / tháng: (tự ước tính)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "further-reading/model-prices.md (BTC xem 25/11/2026) · https://developers.openai.com/api/docs/pricing · tầng Nhỏ · model đã đo token ở eval"
  - model: gpt-6.2-sol
    input: 2.00
    output: 10.00
    source: "further-reading/model-prices.md (BTC xem 25/11/2026) · https://developers.openai.com/api/docs/pricing · tầng Lớn"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
