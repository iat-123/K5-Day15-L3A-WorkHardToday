# Reusable verification gate shared by ci.yml and deploy.yml so PR checks and
# production deploys always run the exact same checks.
name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Verify web (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    defaults:
      run:
        working-directory: vpost
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Pinned to vpost/package.json's packageManager because the action only
      # reads package.json at the repository root.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vpost/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dependency rules
        run: pnpm depcruise

      - name: Theme artifacts check
        run: pnpm theme:check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  api:
    name: Verify api (Python pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vpost
          POSTGRES_PASSWORD: vpost
          POSTGRES_DB: vpost
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vpost -d vpost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://vpost:vpost@127.0.0.1:5432/vpost
      MODEL_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Pytest
        run: python -m pytest -q
